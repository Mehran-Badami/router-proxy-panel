name: Tests and container checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/rpp-ui" playwright@1.62.1
          "$RUNNER_TEMP/rpp-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check mobile panel and preserve settings
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/rpp-ui/node_modules/playwright/index.mjs
          UI_ARTIFACT_DIR: ${{ runner.temp }}/panel-ui-artifacts
        run: node tests/integration/panel_ui.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: panel-ui-previews
          path: ${{ runner.temp }}/panel-ui-artifacts/
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/privacy_guard.py
      - run: docker build -t router-proxy-panel:ci .
      - run: python tests/integration/container_smoke.py --image router-proxy-panel:ci
      - run: python -m pip install cryptography
      - run: python tests/integration/native_tun_smoke.py --image router-proxy-panel:ci
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: audited-source
          path: dist/
