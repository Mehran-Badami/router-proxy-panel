services:
  panel:
    build: .
    image: router-proxy-panel:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:8443:8443"
    environment:
      PUBLIC_ORIGIN: http://localhost:8080
      ALLOW_SYSTEM_BOOTSTRAP: "true"
    volumes:
      - panel-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  panel-data:
